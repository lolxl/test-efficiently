<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 720" role="img" aria-labelledby="arcTitle arcDesc">
  <title id="arcTitle">Improvement arc, complete time</title>
  <desc id="arcDesc">Bar length is minutes. Point 1 is 115.41 minutes, 1 hour 55.41 minutes, a case-study narrative-only figure with no JSON field. Point 2 is 3,399.379 seconds, about 56 minutes 40 seconds, a case-study narrative-only figure with no JSON field. Point 3 is Candidate A, before_fixture_repair_tooling2, JSON rounded display 2038.383 seconds, about 33 minutes 58 seconds. Point 4 is Candidate B, repaired_fixtures_tooling4, JSON rounded display 1817.171 seconds, 30m17.171s. Point 5 is the 30-minute target, 1800 seconds.</desc>
  <rect width="1180" height="720" fill="#ffffff"/>
  <text x="32" y="36" fill="#1c1c1c" font-family="Arial, Helvetica, sans-serif" font-size="22">Improvement arc, complete time</text>
  <text x="32" y="64" fill="#1c1c1c" font-family="Arial, Helvetica, sans-serif" font-size="15">Bar length is minutes. Point 1 is 115.41 minutes. Later bars use the labeled seconds divided by 60.</text>
  <text x="32" y="84" fill="#1c1c1c" font-family="Arial, Helvetica, sans-serif" font-size="15">The division sets the bar length.</text>

  <g font-family="Arial, Helvetica, sans-serif" fill="#1c1c1c">
    <text x="32" y="128" font-size="16">1. 115.41 minutes, 1 hour 55.41 minutes</text>
    <text x="32" y="150" font-size="15" font-weight="700">Case-study narrative-only, no JSON field</text>
    <text x="32" y="172" font-size="15">Complete validation that passed, not the paired benchmark.</text>
    <rect x="640" y="112" width="500" height="26" fill="#f6f0e4" stroke="#7a5b2e" stroke-width="2"/>

    <text x="32" y="224" font-size="16">2. 3,399.379 seconds, about 56 minutes 40 seconds</text>
    <text x="32" y="246" font-size="15" font-weight="700">Case-study narrative-only, no JSON field</text>
    <text x="32" y="268" font-size="15">56.66 minutes is 3,399.379 divided by 60.</text>
    <rect x="640" y="208" width="245.46" height="26" fill="#f6f0e4" stroke="#7a5b2e" stroke-width="2"/>

    <text x="32" y="320" font-size="16">3. Candidate A, before_fixture_repair_tooling2</text>
    <text x="32" y="342" font-size="15">2038.383 seconds, about 33 minutes 58 seconds</text>
    <text x="32" y="364" font-size="15" font-weight="700">JSON-backed rounded display value</text>
    <rect x="640" y="304" width="147.18" height="26" fill="#1f4b73"/>

    <text x="32" y="416" font-size="16">4. Candidate B, repaired_fixtures_tooling4</text>
    <text x="32" y="438" font-size="15">1817.171 seconds, 30 minutes 17 seconds, 30m17.171s</text>
    <text x="32" y="460" font-size="15" font-weight="700">JSON-backed rounded display value</text>
    <rect x="640" y="400" width="131.21" height="26" fill="#1f4b73"/>

    <text x="32" y="512" font-size="16">5. 30-minute target, 1800 seconds</text>
    <text x="32" y="534" font-size="15">target_seconds 1800</text>
    <rect x="640" y="496" width="129.97" height="26" fill="#ffffff" stroke="#1f4b73" stroke-width="2" stroke-dasharray="5 4"/>
  </g>

  <line x1="640" y1="560" x2="1140" y2="560" stroke="#1c1c1c" stroke-width="1"/>
  <line x1="640" y1="554" x2="640" y2="566" stroke="#1c1c1c" stroke-width="1"/>
  <line x1="769.97" y1="554" x2="769.97" y2="566" stroke="#1c1c1c" stroke-width="1"/>
  <line x1="1140" y1="554" x2="1140" y2="566" stroke="#1c1c1c" stroke-width="1"/>
  <text x="640" y="584" fill="#1c1c1c" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle">0</text>
  <text x="769.97" y="584" fill="#1c1c1c" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle">30 min</text>
  <text x="1140" y="584" fill="#1c1c1c" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end">115.41 min</text>

  <text x="32" y="640" fill="#1c1c1c" font-family="Arial, Helvetica, sans-serif" font-size="15">Points 1 and 2 are case-study narrative-only figures with no JSON field.</text>
  <text x="32" y="664" fill="#1c1c1c" font-family="Arial, Helvetica, sans-serif" font-size="15">Points 3 and 4 are JSON-backed rounded display values.</text>
</svg>
